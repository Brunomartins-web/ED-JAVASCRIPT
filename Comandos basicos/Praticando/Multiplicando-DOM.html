<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Multiplicando Valores</h1>
    <input type="number" id="txt1" placeholder="Escolha um numero"> x
    <input type="number" id="txt2" placeholder="Escolha um numero">
    
    <input type="button" value="multiplicar" id="multiplicar">
    
    <div id="res"></div>

    <script>
        let multiplicador = document.getElementById('multiplicar')
        multiplicador.addEventListener('click', multiplicar)

        function multiplicar(){
            let tn1 = document.getElementById('txt1')
            let tn2 = document.getElementById('txt2')

            let n1 = Number(tn1.value)
            let n2 = Number(tn2.value)

            let m = n1 * n2

            res.innerHTML = `A multiplicação entre ${n1} e ${n2} é igual a <strong>${m}</strong>`
        }
    </script>
</body>
</html>

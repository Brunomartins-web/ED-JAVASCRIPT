<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Somadno valores</title>
    <style>
        div#res{
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>Somando Valores</h1>
    <input type="number" name="txtn1" id="txtn1" placeholder="Escolha um numero"> +
    <input type="number" name="txtn2" id="txtn2" placeholder="Escolha um numero">

    <input type="button" value="somar" id="somar">

    <div id="res"></div>

    <script>
        let soma = document.getElementById('somar')
        soma.addEventListener('click', somar)

        function somar(){
            let tn1 = document.getElementById('txtn1')
            let tn2 = document.getElementById('txtn2')

            let n1 = Number(tn1.value)
            let n2 = Number(tn2.value)

            let s = n1 + n2 

            res.innerHTML = `A soma entre ${n1} e ${n2} é igual a <strong>${s}</strong>`
        }
    </script>
</body>
</html>

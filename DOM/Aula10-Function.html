<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos DOM</title>

    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        body{
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #area{
            font: normal 20pt Arial;
            background-color: green;
            color: white;
            width: 200px;
            height: 200px;
            line-height: 200px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="area" onclick="clicar()" onmouseenter="entrar()" onmouseout="sair()">Interação com o DOM</div>
    <script>
        let area = document.getElementById('area')

        function clicar(){
            area.innerText = 'Clicou!'
            area.style.backgroundColor = 'blue'
        }

        function entrar(){
            area.innerText = 'Entrou!'
            area.style.backgroundColor = 'red'
        }

        function sair(){
            area.innerText = 'Saiu!'
            area.style.backgroundColor = 'red'
        }
    </script>
</body>
</html>

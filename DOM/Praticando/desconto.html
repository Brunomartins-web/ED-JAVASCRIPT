<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desconto</title>

    <style>
        body{
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            gap: 40px;
        }

        input{
            height: 30px;
            width: 200px;

            border-radius: 10px;

            display: flex;

            justify-content: center;

            text-align: center;
        }
    </style>
</head>
<body>
    <input type="number" id="produto" placeholder="Digite o valor do produto">
    <input type="number" id="desconto" min="0" max="100" placeholder="Digite o valor do desconto">
    <input type="button" value="Calcular" id="calcular">

    <div id="modal">
    </div>


    <script>

        const produto = document.getElementById('produto');
        const desconto = document.getElementById('desconto');
        const calcular = document.getElementById('calcular');
        const modal = document.getElementById('modal');

        calcular.addEventListener('click', calcularDesconto)

        function calcularDesconto(){

            const conversaoPro = Number(produto.value)
            const conversaoDes = Number(desconto.value)

            const valorDesconto = conversaoPro * (conversaoDes / 100)

            const valorFinal = conversaoPro - valorDesconto

            modal.innerText = 
            `Preço original é: ${conversaoPro.toLocaleString('pt-BR', {style: "currency", currency: 'BRL' })}\n
            Desconto: ${conversaoDes}%\n
            Valor do Desconto: ${valorDesconto.toLocaleString('pt-BR', {style: "currency", currency: 'BRL'})}\n
            Valor final: ${valorFinal.toLocaleString('pt-BR', {style: "currency", currency: 'BRL'})}\n`
        }


    </script>
</body>
</html>

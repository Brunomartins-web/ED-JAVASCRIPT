    <script>
        let produto = Number(window.prompt("Qual o valor do produto?"));

        let desconto = Number.parseInt(window.prompt("Qual a porcentagem de desconto?"));

        let ValorDesconto = produto * (desconto / 100);

        let precoFinal = produto - ValorDesconto;

        document.write(`O valor do produto é: ${produto.toLocaleString('pt-BR', {style: "currency", currency: 'BRL' })} <br>`);

        document.write(`Desconto: ${desconto}% <br>`);

        document.write(`O valor do desconto é: ${ValorDesconto.toLocaleString('pt-BR', {style: "currency", currency: 'BRL'})} <br>`);

        document.write(`O preço final: ${precoFinal.toLocaleString('pt-BR', {style: "currency", currency: 'BRL'})} <br>`)



    </script>
</body>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>SISTEMAS DE MULTAS</h1>
    Velocidade do carro: <input type="number" name="txtvel" id="txtvel"><Km>
    <h><input id="btnVerificar" type="button" value="Verificar"></h>

    <div id="res"></div>
    <script>
        let txtv = document.getElementById('txtvel');
        let btn = document.getElementById('btnVerificar');

        btn.addEventListener('click', verificarVelocidade);

        function verificarVelocidade() {
            let vel = Number(txtv.value);
            let resultado = document.getElementById('res');

            resultado.innerHTML = `<p>Sua velocidade atual é de ${vel} Km/h</p>`;

            if( vel > 60){
                resultado.innerHTML = `<p>Você ultrapassou a velocidade permitida. MULTADO!</p>`;
            }else{
                resultado.innerHTML = `<p>Você está dentro do limite de velocidade.</p>`;
            }
        }
    </script>
</body>
</html>
